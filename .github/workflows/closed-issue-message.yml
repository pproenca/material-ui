name: Add closing message to issue

on:
  issues:
    types:
      - closed

permissions: {}

jobs:
  add-comment:
    name: Add closing message
    if: github.event.issue.state_reason == 'completed'
    uses: mui/mui-public/.github/workflows/issues_add-closing-message.yml@9741b9d5e30ddcd5bccf4020dd59ec56ea4932cb # master
    permissions:
      contents: read
      issues: write
